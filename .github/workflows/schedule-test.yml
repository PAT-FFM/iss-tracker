# TEMPORÄR (15.11.2026): Diagnose, warum stellenmarkt.yml nie per Schedule startet.
# Zwei Crons alle 15 min – einer UTC, einer mit timezone. Wird nach dem Test wieder gelöscht.
name: Schedule-Test

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "9,24,39,54 * * * *"
      timezone: "Europe/Berlin"

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "schedule='${{ github.event.schedule }}' actor=${{ github.actor }} triggering=${{ github.triggering_actor }}"
